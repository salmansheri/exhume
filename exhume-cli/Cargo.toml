[package]
name = "exhume-cli"
version = "0.1.0"
edition = "2024"
description = "Find unused files, exports, dependencies and env vars in JS/TS monorepos"
license = "MIT OR Apache-2.0"

[lib]
name = "exhume"
path = "src/lib.rs"

[[bin]]
name = "exhume"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
oxc_allocator = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_resolver = "=11.24.3"
oxc_span = "=0.155.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
